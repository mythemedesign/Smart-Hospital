services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules
    networks:
      - backend-network 
      - mongodb-network
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - backend-network

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge
  mongodb-network:
    driver: bridge

volumes:
  mongodb_data: 
    name: mongodb_data